<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic Oracle — Айгуль Галинская</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#050505;
color:#f6ead0;
}
.container{
max-width:1200px;
margin:auto;
padding:20px;
}
.hero,.section{
background:#111;
border-radius:30px;
padding:30px;
margin-bottom:30px;
}
.avatar{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
}
.btn{
background:#d6b86c;
border:none;
padding:14px 22px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
margin:6px;
display:inline-block;
text-decoration:none;
color:#000;
}
.cards{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
margin-top:20px;
}
.card{
width:200px;
perspective:1000px;
cursor:pointer;
}
.card-inner{
position:relative;
width:100%;
height:320px;
transition:transform 1s;
transform-style:preserve-3d;
}
.card.flipped .card-inner{
transform:rotateY(180deg);
}
.face{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:20px;
overflow:hidden;
}
.face img{
width:100%;
height:100%;
object-fit:cover;
}
.front{
transform:rotateY(180deg);
}
.result{
margin-top:20px;
padding:24px;
background:#181818;
border-radius:20px;
line-height:1.9;
animation:fade .8s ease;
}
@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
textarea{
width:100%;
min-height:120px;
border-radius:20px;
padding:15px;
background:#0c0c0c;
color:#fff;
border:1px solid #333;
}
</style>
</head>
<body>

<div class="container">

<div class="hero">
<img src="photo.jpg" class="avatar">

<h1>Айгуль Галинская</h1>

<p>
В своей работе я соединяю психологию, нейрокоучинг, Матрицу Судьбы,
Таро, руны, энергопрактики, немного магии и отливки воском.
</p>

<a class="btn" href="https://t.me/aigul_karma" target="_blank">Telegram</a>
<a class="btn" href="https://max.ru/join/jv41Dc6yQ7gsYUAEx2B3aLTTnGmGHKGBSGX1i_kJFhM" target="_blank">MAX</a>
</div>

<div class="section">
<h2>Карта дня</h2>
<button class="btn" onclick="startDay()">Получить карту дня ✨</button>
<div class="cards" id="dayCards"></div>
<div id="dayResult"></div>
</div>

<div class="section">
<h2>Расклад на ситуацию</h2>

<textarea id="question" placeholder="Напиши свой запрос..."></textarea>

<br><br>

<button class="btn" onclick="startSpread()">Открыть расклад ✨</button>

<div class="cards" id="spreadCards"></div>
<div id="spreadResult"></div>
</div>

<div class="section">
<h2>Совет на неделю</h2>

<button class="btn" onclick="startWeek()">Получить совет недели ✨</button>

<div class="cards" id="weekCards"></div>
<div id="weekResult"></div>
</div>

</div>

<script>

const deck=[
{
name:'Солнце',
img:'cards/sun.jpg',
text:'Ты постепенно выходишь из эмоционального напряжения.'
},
{
name:'Луна',
img:'cards/moon.jpg',
text:'Сейчас внутри слишком много тревоги и недосказанности.'
},
{
name:'Императрица',
img:'cards/empress.jpg',
text:'Карта женственности, ресурса и возвращения к себе.'
},
{
name:'Дьявол',
img:'cards/devil.jpg',
text:'Эмоциональные привязки и страх отпустить старое.'
}
];

function randomCard(){
return deck[Math.floor(Math.random()*deck.length)]
}

function createCard(container,callback){

const card=randomCard();

const wrap=document.createElement('div');
wrap.className='card';

wrap.innerHTML=`
<div class="card-inner">
<div class="face back">
<img src="back.jpg">
</div>

<div class="face front">
<img src="${card.img}">
</div>
</div>
`;

let opened=false;

wrap.onclick=()=>{

if(opened)return;

opened=true;

wrap.classList.add('flipped');

callback(card);

};

document.getElementById(container).appendChild(wrap);

}

function shareSite(){

if(navigator.share){

navigator.share({
title:'Mystic Oracle',
url:location.href
})

}else{

navigator.clipboard.writeText(location.href);
alert('Ссылка скопирована ✨');

}

}

function startDay(){

document.getElementById('dayCards').innerHTML='';
document.getElementById('dayResult').innerHTML='';

createCard('dayCards',(card)=>{

document.getElementById('dayResult').innerHTML=`

<div class="result">

<h3>${card.name}</h3>

<p>${card.text}</p>

<p>
Сегодня пространство может подсветить то,
что ты слишком долго не замечала внутри себя.
</p>

<p>
Не дави на себя.
Сегодня важно слышать свои чувства.
</p>

<a class="btn"
href="https://aygulgalinskaya.github.io/oracul/"
target="_blank">
Узнать свой сценарий сейчас
</a>

<button class="btn" onclick="shareSite()">
Поделиться / сохранить
</button>

</div>
`;

});

}

function startSpread(){

document.getElementById('spreadCards').innerHTML='';
document.getElementById('spreadResult').innerHTML='';

let opened=[];

for(let i=0;i<3;i++){

createCard('spreadCards',(card)=>{

opened.push(card);

if(opened.length===3){

showSpread(opened);

}

});

}

}

function showSpread(cards){

document.getElementById('spreadResult').innerHTML=`

<div class="result">

<h3>Общий смысл расклада</h3>

<p>
Сейчас ты находишься в точке внутреннего перехода.
</p>

<p>
Карты показывают:
старый эмоциональный сценарий постепенно перестаёт работать.
</p>

<a class="btn"
href="https://t.me/m/ZM8rt97KOGNi"
target="_blank">
Записаться на полный расклад
</a>

<a class="btn"
href="https://t.me/aigul_karma/1257"
target="_blank">
Как ты сливаешь энергию
</a>

<button class="btn" onclick="shareSite()">
Поделиться / сохранить
</button>

</div>
`;

}

function startWeek(){

document.getElementById('weekCards').innerHTML='';
document.getElementById('weekResult').innerHTML='';

let opened=[];

for(let i=0;i<3;i++){

createCard('weekCards',(card)=>{

opened.push(card);

if(opened.length===3){

showWeek(opened);

}

});

}

}

function showWeek(cards){

document.getElementById('weekResult').innerHTML=`

<div class="result">

<h3>Энергия недели</h3>

<p>
Главная тема недели —
перестать жить только через внутреннее напряжение.
</p>

<a class="btn"
href="https://t.me/m/ZM8rt97KOGNi"
target="_blank">
Полный расклад по ситуации
</a>

<button class="btn" onclick="shareSite()">
Поделиться / сохранить
</button>

</div>
`;

}

</script>

</body>
</html>
