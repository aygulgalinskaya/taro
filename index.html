<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic Oracle — Айгуль Галинская</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#050505;color:#f4e7c2}
.container{max-width:1100px;margin:auto;padding:20px}
.hero,.section{background:#111;border-radius:30px;padding:30px;margin-bottom:30px}
.avatar{width:180px;height:180px;border-radius:50%;object-fit:cover}
.btn{background:#d6b86c;border:none;padding:14px 22px;border-radius:999px;font-weight:bold;cursor:pointer;margin:6px;text-decoration:none;color:#000;display:inline-block}
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.card{width:200px}
.card img{width:100%;border-radius:20px}
.result{margin-top:20px;padding:20px;background:#181818;border-radius:20px;line-height:1.8}
textarea{background:#0f0f0f;color:#fff;border:1px solid #333}
</style>
</head>
<body>

<div class="container">

<div class="hero">
<img src="photo.jpg" class="avatar">
<h1>Айгуль Галинская</h1>
<p>Психология, нейрокоучинг, Матрица Судьбы, Таро, руны, энергопрактики и немного магии.</p>

<a class="btn" href="https://t.me/aigul_karma" target="_blank">Telegram</a>
<a class="btn" href="https://max.ru/join/jv41Dc6yQ7gsYUAEx2B3aLTTnGmGHKGBSGX1i_kJFhM" target="_blank">MAX</a>
</div>

<div class="section">
<h2>Карта дня</h2>
<button class="btn" onclick="cardDay()">Получить карту дня</button>
<div id="day"></div>
</div>

<div class="section">
<h2>Расклад на ситуацию</h2>

<textarea id="question" placeholder="Напиши свой запрос"
style="width:100%;min-height:100px;border-radius:20px;padding:15px"></textarea>

<br><br>

<button class="btn" onclick="spread()">Открыть расклад</button>

<div id="spread"></div>
</div>

<div class="section">
<h2>Совет на неделю</h2>
<button class="btn" onclick="week()">Получить совет недели</button>
<div id="week"></div>
</div>

</div>

<script>

const deck=[
{
name:'Солнце',
img:'cards/sun.jpg',
text:'Ты постепенно выходишь из периода внутреннего напряжения. Эта карта приносит ясность, ощущение жизни и возвращение внутренней уверенности.'
},
{
name:'Луна',
img:'cards/moon.jpg',
text:'Сейчас внутри слишком много тревоги и недосказанности. Ты можешь путаться между страхами и реальностью.'
},
{
name:'Императрица',
img:'cards/empress.jpg',
text:'Тебе важно перестать жить только через контроль и напряжение. Эта карта возвращает к телу, женственности и внутреннему ресурсу.'
},
{
name:'Дьявол',
img:'cards/devil.jpg',
text:'Карта показывает эмоциональные привязки, страх отпустить старое и внутреннюю зависимость от привычных сценариев.'
},
{
name:'Звезда',
img:'cards/star.jpg',
text:'Даже если сейчас тяжело, внутри уже начинается восстановление. Появляется надежда и новый смысл.'
},
{
name:'10 Жезлов',
img:'cards/ten_wands.jpg',
text:'Ты слишком долго тащила всё на себе. Эта карта про эмоциональное перенапряжение и усталость.'
}
];

function randomCard(){
return deck[Math.floor(Math.random()*deck.length)]
}

function share(){
if(navigator.share){
navigator.share({
title:'Mystic Oracle',
url:location.href
})
}else{
navigator.clipboard.writeText(location.href);
alert('Ссылка скопирована');
}
}

function renderCard(card){
return `
<div class='card'>
<img src='${card.img}' onerror="this.src='back.jpg'">
<h3>${card.name}</h3>
<p>${card.text}</p>
</div>
`
}

function cardDay(){

const c=randomCard();

document.getElementById('day').innerHTML=`

<div class='cards'>
${renderCard(c)}
</div>

<div class='result'>

<h3>Энергия дня</h3>

<p>${c.text}</p>

<p>
<strong>Совет:</strong>
сегодня важно не давить на себя и внимательнее относиться к своему внутреннему состоянию.
</p>

<button class='btn' onclick='share()'>
Поделиться / сохранить
</button>

<a class='btn'
href='https://aygulgalinskaya.github.io/oracul/'
target='_blank'>
Узнать свой сценарий сейчас
</a>

</div>
`
}

function spread(){

const c1=randomCard();
const c2=randomCard();
const c3=randomCard();

document.getElementById('spread').innerHTML=`

<div class='cards'>

${renderCard(c1)}
${renderCard(c2)}
${renderCard(c3)}

</div>

<div class='result'>

<h3>Общий смысл расклада</h3>

<p>
Сейчас твоя ситуация связана с внутренним конфликтом между желанием изменений и страхом выйти из старого сценария.
</p>

<p><strong>Что происходит:</strong> ${c1.text}</p>

<p><strong>Причина:</strong> ${c2.text}</p>

<p><strong>Что поможет:</strong> ${c3.text}</p>

<p>
Карты вместе показывают:
ты уже подходишь к точке внутреннего перехода.
</p>

<a class='btn'
href='https://t.me/m/ZM8rt97KOGNi'
target='_blank'>
Записаться на полный расклад
</a>

<a class='btn'
href='https://t.me/aigul_karma/1257'
target='_blank'>
Как ты сливаешь энергию
</a>

<button class='btn' onclick='share()'>
Поделиться / сохранить
</button>

</div>
`
}

function week(){

const c1=randomCard();
const c2=randomCard();
const c3=randomCard();

document.getElementById('week').innerHTML=`

<div class='cards'>

${renderCard(c1)}
${renderCard(c2)}
${renderCard(c3)}

</div>

<div class='result'>

<h3>Совет недели</h3>

<p><strong>Работа и деньги:</strong> ${c1.text}</p>

<p><strong>Отношения:</strong> ${c2.text}</p>

<p><strong>Твоя энергия:</strong> ${c3.text}</p>

<p>
Главная тема недели —
перестать жить только через внутреннее напряжение
и начать возвращать себе эмоциональную устойчивость.
</p>

<a class='btn'
href='https://t.me/m/ZM8rt97KOGNi'
target='_blank'>
Полный расклад по ситуации
</a>

<button class='btn' onclick='share()'>
Поделиться / сохранить
</button>

</div>
`
}

</script>

</body>
</html>
